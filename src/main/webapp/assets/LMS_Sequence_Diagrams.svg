  <!-- DIAGRAM 2: ENROLL IN COURSE FLOW -->
  <!-- ============================================================ -->
  <rect x="40" y="480" width="1120" height="380" rx="10" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
  <rect x="40" y="480" width="1120" height="36" rx="10" fill="#117a65"/>
  <rect x="40" y="504" width="1120" height="12" fill="#117a65"/>
  <text x="600" y="504" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Sequence Diagram 2 — Enroll in Course Flow</text>

  <!-- Actors Row -->
  <rect x="80" y="530" width="100" height="34" rx="6" fill="#2980b9" stroke="#1a5276" stroke-width="1"/>
  <text x="130" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">User</text>

  <rect x="270" y="530" width="150" height="34" rx="6" fill="#ca6f1e" stroke="#784212" stroke-width="1"/>
  <text x="345" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">EnrollServlet</text>

  <rect x="510" y="530" width="160" height="34" rx="6" fill="#1e8449" stroke="#145a32" stroke-width="1"/>
  <text x="590" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">EnrollmentDAO</text>

  <rect x="770" y="530" width="140" height="34" rx="6" fill="#6c3483" stroke="#4a235a" stroke-width="1"/>
  <text x="840" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Database</text>

  <!-- Lifelines -->
  <line x1="130" y1="564" x2="130" y2="830" stroke="#2980b9" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="345" y1="564" x2="345" y2="830" stroke="#ca6f1e" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="590" y1="564" x2="590" y2="830" stroke="#1e8449" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="840" y1="564" x2="840" y2="830" stroke="#6c3483" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Step 1 -->
  <line x1="130" y1="590" x2="337" y2="590" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="237" y="583" text-anchor="middle" font-size="11" fill="#2c3e50">POST /enroll (studentId, courseId)</text>

  <!-- Step 2 -->
  <line x1="345" y1="618" x2="582" y2="618" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="463" y="611" text-anchor="middle" font-size="11" fill="#2c3e50">isEnrolled(studentId, courseId)</text>

  <!-- Step 3 -->
  <line x1="590" y1="645" x2="832" y2="645" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="710" y="638" text-anchor="middle" font-size="11" fill="#2c3e50">SELECT COUNT(*) FROM enrollment WHERE...</text>

  <!-- Step 4 return -->
  <line x1="832" y1="672" x2="598" y2="672" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="710" y="665" text-anchor="middle" font-size="11" fill="#666">false (not enrolled)</text>

  <!-- Step 5 -->
  <line x1="590" y1="700" x2="353" y2="700" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="471" y="693" text-anchor="middle" font-size="11" fill="#666">false</text>

  <!-- Step 6 -->
  <line x1="345" y1="725" x2="582" y2="725" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="463" y="718" text-anchor="middle" font-size="11" fill="#2c3e50">enrollStudent(Enrollment object)</text>

  <!-- Step 7 -->
  <line x1="590" y1="752" x2="832" y2="752" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="710" y="745" text-anchor="middle" font-size="11" fill="#2c3e50">INSERT INTO enrollment VALUES(...)</text>

  <!-- Step 8 return -->
  <line x1="832" y1="779" x2="598" y2="779" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="710" y="772" text-anchor="middle" font-size="11" fill="#666">success</text>

  <!-- Step 9 redirect -->
  <line x1="345" y1="806" x2="138" y2="806" stroke="#1e8449" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr3)"/>
  <text x="241" y="799" text-anchor="middle" font-size="11" fill="#1e8449">redirect → /dashboard</text>

  <!-- Step numbers -->
  <circle cx="147" cy="590" r="9" fill="#2c3e50"/><text x="147" y="594" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text>
  <circle cx="362" cy="618" r="9" fill="#2c3e50"/><text x="362" y="622" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">2</text>
  <circle cx="607" cy="645" r="9" fill="#2c3e50"/><text x="607" y="649" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">3</text>
  <circle cx="815" cy="672" r="9" fill="#888"/><text x="815" y="676" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">4</text>
  <circle cx="573" cy="700" r="9" fill="#888"/><text x="573" y="704" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">5</text>
  <circle cx="362" cy="725" r="9" fill="#2c3e50"/><text x="362" y="729" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">6</text>
  <circle cx="607" cy="752" r="9" fill="#2c3e50"/><text x="607" y="756" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">7</text>
  <circle cx="815" cy="779" r="9" fill="#888"/><text x="815" y="783" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">8</text>
  <circle cx="328" cy="806" r="9" fill="#1e8449"/><text x="328" y="810" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">9</text>

  <!-- ============================================================ -->
  <!-- DIAGRAM 3: MARK LESSON COMPLETE FLOW -->
  <!-- ============================================================ -->
  <rect x="40" y="900" width="1120" height="460" rx="10" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
  <rect x="40" y="900" width="1120" height="36" rx="10" fill="#6c3483"/>
  <rect x="40" y="924" width="1120" height="12" fill="#6c3483"/>
  <text x="600" y="924" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Sequence Diagram 3 — Mark Lesson Complete Flow</text>

  <!-- Actors Row -->
  <rect x="60" y="952" width="100" height="34" rx="6" fill="#2980b9" stroke="#1a5276" stroke-width="1"/>
  <text x="110" y="974" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">User</text>

  <rect x="240" y="952" width="160" height="34" rx="6" fill="#ca6f1e" stroke="#784212" stroke-width="1"/>
  <text x="320" y="974" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ProgressServlet</text>

  <rect x="490" y="952" width="160" height="34" rx="6" fill="#1e8449" stroke="#145a32" stroke-width="1"/>
  <text x="570" y="974" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ProgressDAO</text>

  <rect x="750" y="952" width="140" height="34" rx="6" fill="#6c3483" stroke="#4a235a" stroke-width="1"/>
  <text x="820" y="974" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Database</text>

  <!-- Lifelines -->
  <line x1="110" y1="986" x2="110" y2="1320" stroke="#2980b9" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="320" y1="986" x2="320" y2="1320" stroke="#ca6f1e" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="570" y1="986" x2="570" y2="1320" stroke="#1e8449" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="820" y1="986" x2="820" y2="1320" stroke="#6c3483" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Step 1 -->
  <line x1="110" y1="1012" x2="312" y2="1012" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="210" y="1005" text-anchor="middle" font-size="11" fill="#2c3e50">POST /progress (studentId, lessonId)</text>

  <!-- Step 2: check existing progress -->
  <line x1="320" y1="1040" x2="562" y2="1040" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="440" y="1033" text-anchor="middle" font-size="11" fill="#2c3e50">getProgressByStudent(studentId, lessonId)</text>

  <!-- Step 3 -->
  <line x1="570" y1="1068" x2="812" y2="1068" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="690" y="1061" text-anchor="middle" font-size="11" fill="#2c3e50">SELECT * FROM progress WHERE...</text>

  <!-- Step 4 return -->
  <line x1="812" y1="1096" x2="578" y2="1096" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="694" y="1089" text-anchor="middle" font-size="11" fill="#666">null (no record exists)</text>

  <!-- Step 5 return -->
  <line x1="562" y1="1124" x2="328" y2="1124" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="444" y="1117" text-anchor="middle" font-size="11" fill="#666">null</text>

  <!-- Decision box -->
  <rect x="258" y="1136" width="124" height="22" rx="4" fill="#f5eef8" stroke="#6c3483" stroke-width="0.8"/>
  <text x="320" y="1151" text-anchor="middle" font-size="10" fill="#4a235a">record is null → INSERT</text>

  <!-- Step 6: markComplete -->
  <line x1="320" y1="1176" x2="562" y2="1176" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="440" y="1169" text-anchor="middle" font-size="11" fill="#2c3e50">markComplete(Progress object)</text>

  <!-- Step 7 -->
  <line x1="570" y1="1204" x2="812" y2="1204" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="690" y="1197" text-anchor="middle" font-size="11" fill="#2c3e50">INSERT INTO progress (is_completed=true)</text>

  <!-- Step 8 return -->
  <line x1="812" y1="1232" x2="578" y2="1232" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="694" y="1225" text-anchor="middle" font-size="11" fill="#666">success</text>

  <!-- Step 9 redirect -->
  <line x1="320" y1="1260" x2="118" y2="1260" stroke="#1e8449" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr3)"/>
  <text x="218" y="1253" text-anchor="middle" font-size="11" fill="#1e8449">redirect → /lessons?courseId=X</text>

  <!-- Step numbers -->
  <circle cx="127" cy="1012" r="9" fill="#2c3e50"/><text x="127" y="1016" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text>
  <circle cx="337" cy="1040" r="9" fill="#2c3e50"/><text x="337" y="1044" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">2</text>
  <circle cx="587" cy="1068" r="9" fill="#2c3e50"/><text x="587" y="1072" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">3</text>
  <circle cx="795" cy="1096" r="9" fill="#888"/><text x="795" y="1100" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">4</text>
  <circle cx="545" cy="1124" r="9" fill="#888"/><text x="545" y="1128" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">5</text>
  <circle cx="337" cy="1176" r="9" fill="#2c3e50"/><text x="337" y="1180" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">6</text>
  <circle cx="587" cy="1204" r="9" fill="#2c3e50"/><text x="587" y="1208" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">7</text>
  <circle cx="795" cy="1232" r="9" fill="#888"/><text x="795" y="1236" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">8</text>
  <circle cx="303" cy="1260" r="9" fill="#1e8449"/><text x="303" y="1264" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">9</text>

  <!-- ============================================================ -->
  <!-- LEGEND -->
  <!-- ============================================================ -->
  <rect x="40" y="1348" width="1120" height="42" rx="6" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="60" y="1373" font-size="12" font-weight="700" fill="#333">Legend:</text>
  <line x1="120" y1="1369" x2="170" y2="1369" stroke="#2c3e50" stroke-width="1.5"/>
  <polygon points="168,1365 176,1369 168,1373" fill="#2c3e50"/>
  <text x="182" y="1373" font-size="11" fill="#333">Method call (solid)</text>
  <line x1="320" y1="1369" x2="370" y2="1369" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="368,1365 376,1369 368,1373" fill="#888"/>
  <text x="382" y="1373" font-size="11" fill="#333">Return value (dashed)</text>
  <line x1="540" y1="1369" x2="590" y2="1369" stroke="#1e8449" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="588,1365 596,1369 588,1373" fill="#1e8449"/>
  <text x="602" y="1373" font-size="11" fill="#333">Redirect (success)</text>
  <line x1="730" y1="1369" x2="780" y2="1369" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="778,1365 786,1369 778,1373" fill="#c0392b"/>
  <text x="792" y="1373" font-size="11" fill="#333">Redirect (fail)</text>
  <rect x="920" y="1360" width="12" height="12" rx="2" fill="#2c3e50"/>
  <text x="938" y="1373" font-size="11" fill="#333">Step number</text>
  <line x1="1010" y1="1358" x2="1010" y2="1382" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="1020" y="1373" font-size="11" fill="#333">Lifeline</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#1e8449" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
