<svg width="1200" height="1400" viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="1400" fill="#f8f9fa"/>

  <!-- Main Title -->
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">LMS — Sequence Diagrams (Phase 2)</text>
  <line x1="40" y1="48" x2="1160" y2="48" stroke="#cccccc" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- DIAGRAM 1: LOGIN FLOW -->
  <!-- ============================================================ -->
  <rect x="40" y="60" width="1120" height="390" rx="10" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
  <rect x="40" y="60" width="1120" height="36" rx="10" fill="#2c3e50"/>
  <rect x="40" y="84" width="1120" height="12" fill="#2c3e50"/>
  <text x="600" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Sequence Diagram 1 — Login Flow</text>

  <!-- Actors Row -->
  <!-- User -->
  <rect x="80" y="115" width="100" height="34" rx="6" fill="#2980b9" stroke="#1a5276" stroke-width="1"/>
  <text x="130" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">User</text>
  <!-- LoginServlet -->
  <rect x="290" y="115" width="140" height="34" rx="6" fill="#ca6f1e" stroke="#784212" stroke-width="1"/>
  <text x="360" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">LoginServlet</text>
  <!-- StudentDAO -->
  <rect x="530" y="115" width="140" height="34" rx="6" fill="#1e8449" stroke="#145a32" stroke-width="1"/>
  <text x="600" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">StudentDAO</text>
  <!-- Database -->
  <rect x="780" y="115" width="140" height="34" rx="6" fill="#6c3483" stroke="#4a235a" stroke-width="1"/>
  <text x="850" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Database</text>

  <!-- Lifelines -->
  <line x1="130" y1="149" x2="130" y2="430" stroke="#2980b9" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="360" y1="149" x2="360" y2="430" stroke="#ca6f1e" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="600" y1="149" x2="600" y2="430" stroke="#1e8449" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="850" y1="149" x2="850" y2="430" stroke="#6c3483" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Step 1: User → LoginServlet -->
  <line x1="130" y1="175" x2="352" y2="175" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="240" y="168" text-anchor="middle" font-size="11" fill="#2c3e50">POST /login (email, password)</text>

  <!-- Step 2: LoginServlet → StudentDAO -->
  <line x1="360" y1="205" x2="592" y2="205" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="480" y="198" text-anchor="middle" font-size="11" fill="#2c3e50">getStudentByEmail(email)</text>

  <!-- Step 3: StudentDAO → Database -->
  <line x1="600" y1="235" x2="842" y2="235" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="720" y="228" text-anchor="middle" font-size="11" fill="#2c3e50">SELECT * FROM student WHERE email=?</text>

  <!-- Step 4: Database → StudentDAO (return) -->
  <line x1="842" y1="265" x2="608" y2="265" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="720" y="258" text-anchor="middle" font-size="11" fill="#666666">ResultSet row</text>

  <!-- Step 5: StudentDAO → LoginServlet (return) -->
  <line x1="592" y1="295" x2="368" y2="295" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="480" y="288" text-anchor="middle" font-size="11" fill="#666666">Student object</text>

  <!-- Step 6: LoginServlet validates -->
  <rect x="310" y="308" width="100" height="22" rx="4" fill="#fdebd0" stroke="#ca6f1e" stroke-width="0.8"/>
  <text x="360" y="323" text-anchor="middle" font-size="10" fill="#784212">validate password</text>

  <!-- Step 7a: Success path -->
  <line x1="360" y1="355" x2="138" y2="355" stroke="#1e8449" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr3)"/>
  <text x="248" y="348" text-anchor="middle" font-size="11" fill="#1e8449">redirect → /dashboard [success]</text>

  <!-- Step 7b: Failure path -->
  <line x1="360" y1="385" x2="138" y2="385" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr4)"/>
  <text x="248" y="378" text-anchor="middle" font-size="11" fill="#c0392b">redirect → /login?error=1 [fail]</text>

  <!-- Step numbers -->
  <circle cx="147" cy="175" r="9" fill="#2c3e50"/>
  <text x="147" y="179" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text>
  <circle cx="377" cy="205" r="9" fill="#2c3e50"/>
  <text x="377" y="209" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">2</text>
  <circle cx="617" cy="235" r="9" fill="#2c3e50"/>
  <text x="617" y="239" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">3</text>
  <circle cx="825" cy="265" r="9" fill="#888"/>
  <text x="825" y="269" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">4</text>
  <circle cx="575" cy="295" r="9" fill="#888"/>
  <text x="575" y="299" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">5</text>
  <circle cx="343" cy="355" r="9" fill="#1e8449"/>
  <text x="343" y="359" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">6</text>
  <circle cx="343" cy="385" r="9" fill="#c0392b"/>
  <text x="343" y="389" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">7</text>

